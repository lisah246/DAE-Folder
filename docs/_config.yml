# =====================
# SITE BASICS
# =====================
title: "Lisa Hom — Backend Developer"
description: "Portfolio showcasing case studies demonstrating backend development skills."
url: "https://lisah246.github.io/" # ← Your actual GitHub username
baseurl: "/lisah246/DAE-Folder" # ← Your actual repository name

# =====================
# THEME (Modern)
# =====================
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "default"

# =====================
# AUTHOR PROFILE
# =====================
author:
    name: "Lisa Hom"
    avatar: "C:\Users\Lisa\Desktop\DAE-Folder\docs\assets\img\Lisa_Headshot.jpg" # ← Fixed from .heic
    bio: "Backend developer focused on building robust server-side logic, scalable databases, and intuitive APIs that power modern web and mobile applications. "
    email: "lisah246@gmail.com"
    links:
        - label: "GitHub"
          icon: "fab fa-github"
          url: "https://lisah246.github.io/"
        - label: "LinkedIn"
          icon: "fab fa-linkedin"
          url: "https://www.linkedin.com/in/your-profile/"

# =====================
# NAVIGATION (top menu)
# =====================
# Navigation is configured in _data/navigation.yml for Minimal Mistakes theme

# =====================
# BRANDING
# =====================
logo: "C:\Users\Lisa\Desktop\DAE-Folder\docs\assets\img\dae_logo.jpg" # ← Fixed from .avif

# =====================
# PLUGINS (safe + GitHub Pages supported)
# =====================
plugins:
    - jekyll-feed
    - jekyll-seo-tag
    - jekyll-include-cache
    - jekyll-remote-theme

# =====================
# BUILD & MARKDOWN
# =====================
markdown: kramdown
highlighter: rouge
permalink: pretty

# =====================
# GLOBAL DEFAULTS (keeps layout consistent)
# =====================
# These defaults apply Minimal Mistakes' single-page layout with a sticky ToC.
# They won't break Minima; Minima ignores unknown front matter values.
defaults:
    - scope:
          path: ""
          type: "pages"
      values:
          layout: single
          toc: true
          toc_sticky: true
          author_profile: true

# =====================
# EXCLUDES (keep the build clean)
# =====================
